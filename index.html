<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --cream: #F3EEE1;
    --dot: #E4DCC8;
    --olive: #6B7250;
    --olive-dark: #4E5439;
    --salmon: #E8927C;
    --salmon-dark: #D9765D;
    --brown: #3D2E24;
    --paper: #FBF8F0;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ height: 100%; overflow-x: hidden; }
  body{
    margin:0;
    font-family: 'Pretendard', -apple-system, sans-serif;
    background-color: var(--cream);
    background-image: radial-gradient(var(--dot) 1.4px, transparent 1.4px);
    background-size: 22px 22px;
    color: var(--brown);
    min-height: 100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width: 460px;
    padding: 28px 20px 60px;
    min-height:100vh;
  }
  #splashScreen{
    position: fixed;
    inset: 0;
    z-index: 2000;
    background-color: var(--cream);
    background-image: radial-gradient(var(--dot) 1.4px, transparent 1.4px);
    background-size: 22px 22px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: opacity 0.5s ease;
  }
  #splashScreen.hide{
    opacity: 0;
    pointer-events: none;
  }
  .splash-content{
    text-align:center;
  }
  .splash-content img{
    width: 150px;
    height: auto;
    margin-bottom: 16px;
    filter: drop-shadow(2px 4px 6px rgba(61,46,36,0.18));
    animation: splashPop 0.6s ease;
  }
  .splash-content h1{
    font-size: 32px;
    font-weight: 800;
    color: var(--olive-dark);
    margin: 0;
    letter-spacing: -0.5px;
  }
  .splash-credit{
    font-size: 12px;
    font-weight: 600;
    color: var(--brown);
    opacity: 0.45;
    margin: 6px 0 0;
  }
  @keyframes splashPop{
    from{ transform: scale(0.85); opacity: 0; }
    to{ transform: scale(1); opacity: 1; }
  }

  header{
    text-align:center;
    margin-bottom: 18px;
  }
  header h1{
    font-size: 30px;
    font-weight: 800;
    margin: 0;
    color: var(--olive-dark);
    letter-spacing: -0.5px;
  }
  header p{
    margin: 6px 0 0;
    font-size: 14px;
    color: var(--brown);
    opacity: 0.65;
  }

  /* ---- 마이크 존 ---- */
  .mic-zone{
    position: relative;
    display:flex;
    flex-direction: column;
    align-items:center;
    margin: 22px auto 30px;
  }
  .mic-btn{
    position: relative;
    width: 200px;
    height: auto;
    border: none;
    background: none;
    padding: 0;
    cursor:pointer;
    transition: transform .15s ease;
    filter: drop-shadow(2px 4px 3px rgba(61,46,36,0.18));
  }
  .mic-btn img{
    width: 100%;
    height: auto;
    display: block;
  }
  .mic-btn:active{
    transform: translateY(3px) scale(0.98);
  }
  .mic-btn.recording{
    animation: pulse 1.1s infinite ease-in-out;
  }
  @keyframes pulse{
    0%,100%{ transform: scale(1); filter: drop-shadow(2px 4px 3px rgba(61,46,36,0.18)); }
    50%{ transform: scale(1.06); filter: drop-shadow(2px 4px 10px rgba(232,146,124,0.55)); }
  }
  .status-text{
    min-height: 22px;
    font-size: 14px;
    font-weight: 600;
    color: var(--olive-dark);
    margin-top: 4px;
  }
  .live-text{
    min-height: 24px;
    max-width: 320px;
    text-align:center;
    font-size: 15px;
    color: var(--brown);
    opacity: 0.8;
    font-style: italic;
  }
  .camera-btn{
    margin-top: 14px;
    width: 92px;
    height: auto;
    padding: 0;
    border: none;
    background: none;
    cursor: pointer;
    transition: transform .15s ease;
    filter: drop-shadow(2px 3px 3px rgba(61,46,36,0.2));
  }
  .camera-btn img{
    width: 100%;
    height: auto;
    display: block;
  }
  .camera-btn:active{
    transform: scale(0.94);
  }
  .item-photo{
    max-width: 100%;
    border-radius: 10px;
    border: 2px solid var(--brown);
    margin-top: 8px;
    display: block;
  }
  .item.done .item-photo{
    opacity: 0.5;
  }

  /* ---- 리스트 ---- */
  .list-section{ margin-top: 10px; }
  .list-header{
    display:flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding: 0 4px;
  }
  .list-header .count{
    font-size: 14px;
    font-weight: 700;
    color: var(--brown);
  }
  .list-header .count b{ color: var(--salmon-dark); }
  .toggle-btn{
    background: none;
    border: none;
    font-size: 13px;
    color: var(--olive-dark);
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }

  .cal-toggle-btn{
    margin-top: 10px;
    background: var(--paper);
    border: 2px solid var(--brown);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 700;
    color: var(--brown);
    cursor: pointer;
  }
  .item-schedule{
    display:inline-block;
    margin-top: 4px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--paper);
    background: var(--olive);
    padding: 2px 8px;
    border-radius: 10px;
  }
  .sched-btn{
    flex:none;
    background:none;
    border:none;
    font-size: 15px;
    opacity: 0.55;
    cursor:pointer;
    padding: 2px 4px;
  }

  /* ---- 캘린더 화면 ---- */
  .calendar-view{ padding-top: 6px; }
  .cal-header{
    display:flex;
    flex-direction: column;
    align-items:center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .cal-nav{
    display:flex;
    align-items:center;
    gap: 18px;
  }
  .cal-nav-btn{
    background: var(--paper);
    border: 2px solid var(--brown);
    border-radius: 50%;
    width: 34px; height: 34px;
    font-size: 18px;
    font-weight: 800;
    color: var(--brown);
    cursor: pointer;
  }
  .cal-month-label{
    font-size: 18px;
    font-weight: 800;
    color: var(--olive-dark);
    min-width: 110px;
    text-align:center;
  }
  .cal-weekdays{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    text-align:center;
    font-size: 12px;
    font-weight: 700;
    color: var(--brown);
    opacity: 0.6;
    margin-bottom: 4px;
  }
  .cal-grid{
    display:flex;
    flex-direction: column;
    gap: 3px;
  }
  .cal-week{
    position: relative;
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .cal-bar{
    position: absolute;
    height: 15px;
    border-radius: 5px;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--paper);
    background: var(--salmon);
    display:flex;
    align-items:center;
    padding: 0 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    z-index: 2;
    box-sizing: border-box;
  }
  .cal-bar.done{
    text-decoration: line-through;
    opacity: 0.6;
    background: var(--brown);
  }
  .cal-bar.moving{
    outline: 2px dashed var(--brown);
    animation: movePulse 0.9s infinite;
  }
  .cal-day{
    min-height: 78px;
    min-width: 0;
    width: 100%;
    box-sizing: border-box;
    display:flex;
    flex-direction: column;
    align-items:stretch;
    padding: 4px 3px 6px;
    border-radius: 8px;
    background: var(--paper);
    border: 1.5px solid transparent;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .cal-day .day-num{
    font-size: 12px;
    font-weight: 700;
    color: var(--brown);
    margin-bottom: 3px;
    padding-right: 18px;
  }
  .cal-day-weather{
    position: absolute;
    top: 2px;
    right: 2px;
    width: 18px;
    height: 18px;
    object-fit: contain;
  }
  .cal-day.other-month{ opacity: 0.35; }
  .cal-day.today{ border-color: var(--salmon); }
  .cal-day.today .day-num{ color: var(--salmon-dark); }
  .cal-day.selected{ background: var(--salmon); border-color: var(--salmon-dark); }
  .cal-day.selected .day-num{ color: var(--paper); }
  .cal-day-events{
    display:flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .cal-event-chip{
    font-size: 10px;
    line-height: 1.5;
    font-weight: 700;
    color: var(--paper);
    background: var(--olive);
    border-radius: 5px;
    padding: 1px 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    max-width: 100%;
    box-sizing: border-box;
  }
  .cal-event-chip.is-todo{ background: var(--salmon); }
  .cal-event-chip.done{
    text-decoration: line-through;
    opacity: 0.6;
    background: var(--brown);
  }
  .cal-day.selected .cal-event-chip{
    background: rgba(255,255,255,0.85);
    color: var(--olive-dark);
  }
  .cal-event-chip.moving{
    outline: 2.5px dashed var(--brown);
    animation: movePulse 0.9s infinite;
  }
  .day-detail-item.moving{
    outline: 2.5px dashed var(--brown);
    animation: movePulse 0.9s infinite;
  }
  @keyframes movePulse{
    0%,100%{ opacity: 1; }
    50%{ opacity: 0.55; }
  }
  .cal-day.move-target{
    box-shadow: 0 0 0 3px var(--salmon-dark) inset;
  }
  .add-event-btn{
    display:block;
    width: 100%;
    margin: 4px 0 14px;
    background: var(--olive);
    color: var(--paper);
    border: 2px solid var(--olive-dark);
    border-radius: 12px;
    padding: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor:pointer;
  }

  .day-detail{
    margin-top: 16px;
  }
  .day-detail-header{
    font-size: 15px;
    font-weight: 800;
    color: var(--olive-dark);
    margin-bottom: 10px;
  }
  .day-detail-section-label{
    font-size: 12px;
    font-weight: 700;
    color: var(--brown);
    opacity: 0.55;
    margin: 10px 0 6px;
  }
  .day-detail-item{
    display:flex;
    align-items:center;
    gap: 10px;
    background: var(--paper);
    border: 2px solid var(--brown);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
  }
  .day-detail-item.done .day-detail-text{
    text-decoration: line-through;
    opacity: 0.45;
  }
  .day-detail-text{ flex: 1; cursor: pointer; }
  .day-detail-textwrap{ flex: 1; cursor: pointer; min-width: 0; }
  .day-detail-note{
    font-size: 12px;
    color: var(--brown);
    opacity: 0.6;
    margin-top: 2px;
    white-space: normal;
    word-break: break-word;
  }
  .day-detail-time{
    flex:none;
    font-weight: 800;
    color: var(--salmon-dark);
    min-width: 48px;
  }
  .day-detail-empty{
    text-align:center;
    padding: 20px 10px;
    color: var(--brown);
    opacity: 0.5;
    font-size: 13.5px;
  }

  /* ---- 스케줄 모달 ---- */
  .modal-overlay{
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(61,46,36,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 999;
    padding: 20px;
    box-sizing: border-box;
  }
  .modal-box{
    background: var(--paper);
    border: 2px solid var(--brown);
    border-radius: 16px;
    padding: 20px 16px;
    width: 100%;
    max-width: 340px;
    box-sizing: border-box;
    overflow: hidden;
    display:flex;
    flex-direction: column;
    gap: 12px;
  }
  .modal-title{
    font-size: 16px;
    font-weight: 800;
    color: var(--olive-dark);
    text-align:center;
  }
  .modal-input{
    width: 100%;
    min-width: 0;
    max-width: 100%;
    box-sizing: border-box;
    display: block;
    -webkit-appearance: none;
    appearance: none;
    padding: 10px 12px;
    margin: 0;
    border-radius: 10px;
    border: 2px solid var(--brown);
    font-family: 'Pretendard', sans-serif;
    font-size: 14px;
    background: var(--cream);
    color: var(--brown);
    text-align: left;
  }
  .modal-actions{
    display:flex;
    gap: 8px;
  }
  .modal-btn-secondary, .modal-btn-primary{
    flex: 1;
    padding: 10px 8px;
    border-radius: 10px;
    border: 2px solid var(--brown);
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .modal-btn-secondary{ background: var(--paper); color: var(--brown); }
  .modal-btn-primary{ background: var(--olive); color: var(--paper); border-color: var(--olive-dark); }
  .modal-cancel{
    background:none;
    border:none;
    color: var(--brown);
    opacity: 0.6;
    font-size: 13px;
    text-align:center;
    cursor:pointer;
    padding: 4px;
  }

  #itemList{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    flex-direction: column;
    gap: 12px;
  }
  .item{
    position: relative;
    background: var(--paper);
    border: 2px solid var(--brown);
    border-radius: 14px 16px 15px 14px / 16px 14px 16px 14px;
    padding: 14px 16px;
    display:flex;
    align-items:flex-start;
    gap: 12px;
    transform: rotate(var(--r, 0deg));
    animation: pop .25s ease;
  }
  .item:nth-child(3n+1){ --r: -0.6deg; }
  .item:nth-child(3n+2){ --r: 0.5deg; }
  .item:nth-child(3n){ --r: -0.3deg; }
  @keyframes pop{
    from{ opacity:0; transform: translateY(6px) rotate(var(--r,0deg)); }
    to{ opacity:1; transform: translateY(0) rotate(var(--r,0deg)); }
  }
  .checkbox{
    flex: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2.5px solid var(--olive);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    margin-top: 1px;
    background: transparent;
    color: var(--paper);
    font-size: 14px;
    font-weight: 900;
  }
  .checkbox.done{
    background: var(--olive);
  }
  .item-body{ flex: 1; min-width: 0; }
  .item-text{
    font-size: 15.5px;
    font-weight: 600;
    line-height: 1.4;
    word-break: break-word;
  }
  .item.done .item-text{
    text-decoration: line-through;
    opacity: 0.45;
  }
  .item-time{
    font-size: 11.5px;
    color: var(--brown);
    opacity: 0.5;
    margin-top: 3px;
  }
  .edit-btn{
    flex:none;
    background:none;
    border:none;
    font-size: 15px;
    color: var(--olive-dark);
    opacity: 0.55;
    cursor:pointer;
    padding: 2px 4px;
  }
  .del-btn{
    flex:none;
    background:none;
    border:none;
    font-size: 16px;
    color: var(--brown);
    opacity: 0.35;
    cursor:pointer;
    padding: 2px 4px;
  }
  .empty{
    text-align:center;
    padding: 30px 10px;
    color: var(--brown);
    opacity: 0.5;
    font-size: 14px;
    line-height: 1.6;
  }
</style>
</head>

<script>

// ---------- 데이터 (localStorage) ----------
const STORAGE_KEY = 'tteoolradda-items';
let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let showDone = false;

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }

function timeAgo(ts){
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  if(sameDay) return `오늘 ${hh}:${mm}`;
  return `${d.getMonth()+1}/${d.getDate()} ${hh}:${mm}`;
}

function render(){
  const list = document.getElementById('itemList');
  const unscheduled = items.filter(i => !i.scheduledDate);
  const pending = unscheduled.filter(i => !i.done);
  document.getElementById('pendingCount').textContent = pending.length;

  const visible = showDone ? unscheduled : pending;
  list.innerHTML = '';

  if(visible.length === 0){
    list.innerHTML = `<div class="empty">${showDone ? '아직 완료한 게 없어요' : '아직 아이디어가 없어요.<br>마이크 눌러서 첫 생각을 남겨보세요!'}</div>`;
    return;
  }

  visible.slice().reverse().forEach(item => {
    const li = document.createElement('li');
    li.className = 'item' + (item.done ? ' done' : '');
    li.innerHTML = `
      <button class="checkbox ${item.done ? 'done' : ''}" data-id="${item.id}">${item.done ? '✓' : ''}</button>
      <div class="item-body">
        <div class="item-text">${item.text}</div>
        <div class="item-time">${timeAgo(item.createdAt)}</div>
        ${item.image ? `<img class="item-photo" src="${item.image}" alt="사진 메모">` : ''}
      </div>
      <button class="sched-btn" data-sched="${item.id}">📅</button>
      <button class="edit-btn" data-edit="${item.id}">✏️</button>
      <button class="del-btn" data-del="${item.id}">✕</button>
    `;
    list.appendChild(li);
  });
}

document.getElementById('itemList').addEventListener('click', (e) => {
  const checkBtn = e.target.closest('.checkbox');
  const delBtn = e.target.closest('.del-btn');
  const editBtn = e.target.closest('.edit-btn');
  const schedBtn = e.target.closest('.sched-btn');
  if(checkBtn){
    const id = checkBtn.dataset.id;
    const it = items.find(i => String(i.id) === id);
    if(it){ it.done = !it.done; save(); render(); }
  }
  if(delBtn){
    const id = delBtn.dataset.del;
    items = items.filter(i => String(i.id) !== id);
    save(); render();
  }
  if(editBtn){
    const id = editBtn.dataset.edit;
    const it = items.find(i => String(i.id) === id);
    if(it){
      const newText = prompt('내용을 수정해주세요', it.text);
      if(newText !== null && newText.trim()){
        it.text = newText.trim();
        save(); render();
      }
    }
  }
  if(schedBtn){
    openScheduleModal(schedBtn.dataset.sched);
  }
});

// ---------- 날짜/일정 유틸 ----------
function pad2(n){ return String(n).padStart(2,'0'); }
function toDateStr(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

function formatScheduleBadge(item){
  const [y,m,dd] = item.scheduledDate.split('-');
  const dateLabel = `${parseInt(m)}/${parseInt(dd)}`;
  return item.scheduledTime ? `${dateLabel} ${item.scheduledTime}` : dateLabel;
}

// ---------- 화면 전환 ----------
const listView = document.getElementById('listView');
const calendarView = document.getElementById('calendarView');
const scheduledView = document.getElementById('scheduledView');

document.getElementById('openCalendarBtn').addEventListener('click', () => {
  listView.style.display = 'none';
  calendarView.style.display = 'block';
  renderCalendar();
});
document.getElementById('backToListBtn').addEventListener('click', () => {
  calendarView.style.display = 'none';
  listView.style.display = 'block';
});

document.getElementById('openScheduledBtn').addEventListener('click', () => {
  listView.style.display = 'none';
  scheduledView.style.display = 'block';
  renderScheduledList();
});
document.getElementById('backToListFromScheduledBtn').addEventListener('click', () => {
  scheduledView.style.display = 'none';
  listView.style.display = 'block';
});

function renderScheduledList(){
  const listEl = document.getElementById('scheduledList');
  const scheduled = items
    .filter(i => i.scheduledDate)
    .sort((a,b) => (a.scheduledDate + (a.scheduledTime||'99:99')).localeCompare(b.scheduledDate + (b.scheduledTime||'99:99')));

  if(scheduled.length === 0){
    listEl.innerHTML = `<div class="empty">캘린더로 보낸 일정이 아직 없어요.<br>목록에서 📅 버튼을 눌러 날짜를 정해보세요!</div>`;
    return;
  }

  listEl.innerHTML = scheduled.map(item => `
    <li class="item${item.done ? ' done' : ''}">
      <button class="checkbox ${item.done ? 'done' : ''}" data-schedcheck="${item.id}">${item.done ? '✓' : ''}</button>
      <div class="item-body">
        <div class="item-text">${item.text}</div>
        <span class="item-schedule">📅 ${formatScheduleBadge(item)}</span>
      </div>
      <button class="edit-btn" data-schededit="${item.id}">✏️</button>
      <button class="del-btn" data-schedunset="${item.id}">✕</button>
    </li>
  `).join('');
}

document.getElementById('scheduledList').addEventListener('click', (e) => {
  const checkBtn = e.target.closest('[data-schedcheck]');
  const editBtn = e.target.closest('[data-schededit]');
  const unsetBtn = e.target.closest('[data-schedunset]');
  if(checkBtn){
    const it = items.find(i => String(i.id) === checkBtn.dataset.schedcheck);
    if(it){ it.done = !it.done; save(); renderScheduledList(); }
  }
  if(editBtn){
    const it = items.find(i => String(i.id) === editBtn.dataset.schededit);
    if(it){
      const newText = prompt('내용을 수정해주세요', it.text);
      if(newText !== null && newText.trim()){ it.text = newText.trim(); save(); renderScheduledList(); }
    }
  }
  if(unsetBtn){
    const it = items.find(i => String(i.id) === unsetBtn.dataset.schedunset);
    if(it && confirm('캘린더 일정을 해제하고 다시 할일 목록으로 보낼까요?')){
      it.scheduledDate = null;
      it.scheduledTime = null;
      save(); render(); renderScheduledList();
    }
  }
});

function weatherIcon(code){
  if(code === 0) return WEATHER_IMG.sun;
  if(code >= 1 && code <= 3) return WEATHER_IMG.cloud;
  if(code === 45 || code === 48) return WEATHER_IMG.cloud;
  if((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return WEATHER_IMG.rain;
  if((code >= 71 && code <= 77) || code === 85 || code === 86) return WEATHER_IMG.snow;
  if(code >= 95) return WEATHER_IMG.rain;
  return '';
}

function setWeatherStatus(msg){
  const el = document.getElementById('weatherStatus');
  if(el) el.textContent = msg;
}

function fetchWeather(lat, lon){
  setWeatherStatus(`날씨 불러오는 중... (${lat.toFixed(2)}, ${lon.toFixed(2)})`);
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode&timezone=auto&forecast_days=16`;
  fetch(url)
    .then(res => {
      if(!res.ok) throw new Error('응답 오류 ' + res.status);
      return res.json();
    })
    .then(data => {
      if(data && data.daily && data.daily.time){
        data.daily.time.forEach((dateStr, i) => {
          weatherByDate[dateStr] = data.daily.weathercode[i];
        });
        localStorage.setItem('tteoolradda-weather', JSON.stringify({ data: weatherByDate, fetchedAt: Date.now() }));
        setWeatherStatus(`날씨 ${data.daily.time.length}일치 불러옴 ✓`);
        renderCalendar();
      } else {
        setWeatherStatus('날씨 응답에 데이터가 없어요');
      }
    })
    .catch((err) => {
      setWeatherStatus('날씨 실패: ' + err.message);
    });
}

function initWeather(){
  const cached = JSON.parse(localStorage.getItem('tteoolradda-weather') || 'null');
  const oneHour = 60 * 60 * 1000;
  if(cached && cached.fetchedAt && (Date.now() - cached.fetchedAt) < oneHour){
    weatherByDate = cached.data;
    setWeatherStatus('저장된 날씨 사용 중 ✓');
    return;
  }
  const fallbackLat = 37.6584, fallbackLon = 126.8320;
  if(navigator.geolocation){
    setWeatherStatus('위치 확인 중...');
    navigator.geolocation.getCurrentPosition(
      (pos) => fetchWeather(pos.coords.latitude, pos.coords.longitude),
      (err) => { setWeatherStatus('위치 실패(' + err.message + '), 고양시로 시도'); fetchWeather(fallbackLat, fallbackLon); },
      { timeout: 5000 }
    );
  } else {
    setWeatherStatus('위치 기능 없음, 고양시로 시도');
    fetchWeather(fallbackLat, fallbackLon);
  }
}
initWeather();

// ---------- 월간 캘린더 ----------
let calDate = new Date();
let selectedDateStr = null;
let movingEntry = null; // { src, id }

function setMoveMode(src, id){
  movingEntry = { src, id };
  document.getElementById('moveBanner').style.display = 'block';
  renderCalendar();
  if(selectedDateStr) renderDayDetail(selectedDateStr);
}
function clearMoveMode(){
  movingEntry = null;
  document.getElementById('moveBanner').style.display = 'none';
  renderCalendar();
  if(selectedDateStr) renderDayDetail(selectedDateStr);
}
function moveEntryToDate(src, id, newDateStr){
  const entry = findEntry(src, id);
  if(!entry) return;
  if(src === 'item'){
    entry.scheduledDate = newDateStr;
    save();
  } else {
    if(entry.endDate){
      const oldStart = new Date(entry.date + 'T00:00:00');
      const oldEnd = new Date(entry.endDate + 'T00:00:00');
      const durationDays = Math.round((oldEnd - oldStart) / 86400000);
      const newStart = new Date(newDateStr + 'T00:00:00');
      const newEnd = new Date(newStart);
      newEnd.setDate(newEnd.getDate() + durationDays);
      entry.date = newDateStr;
      entry.endDate = toDateStr(newEnd);
    } else {
      entry.date = newDateStr;
    }
    saveCalEvents();
  }
}

// ---------- 길게 눌러서 이동하기 ----------
let longPressJustFired = false;

function attachLongPress(el, onLongPress){
  let timer = null;
  let moved = false;
  let startX = 0, startY = 0;

  const start = (x, y) => {
    moved = false;
    startX = x; startY = y;
    timer = setTimeout(() => {
      if(!moved){
        if(navigator.vibrate) navigator.vibrate(30);
        longPressJustFired = true;
        setTimeout(() => { longPressJustFired = false; }, 400);
        onLongPress();
      }
    }, 480);
  };
  const move = (x, y) => {
    if(Math.abs(x-startX) > 12 || Math.abs(y-startY) > 12){
      moved = true;
      clearTimeout(timer);
    }
  };
  const cancel = () => { clearTimeout(timer); };

  el.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    start(t.clientX, t.clientY);
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    move(t.clientX, t.clientY);
  }, { passive: true });
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchcancel', cancel);

  // 데스크탑 테스트용(마우스)
  el.addEventListener('mousedown', (e) => start(e.clientX, e.clientY));
  el.addEventListener('mousemove', (e) => { if(timer) move(e.clientX, e.clientY); });
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
}


const CAL_EVENTS_KEY = 'tteoolradda-calendar-events';
let calendarEvents = JSON.parse(localStorage.getItem(CAL_EVENTS_KEY) || '[]');
function saveCalEvents(){ localStorage.setItem(CAL_EVENTS_KEY, JSON.stringify(calendarEvents)); }

function isMultiDay(ev){
  return ev && ev.endDate && ev.endDate !== ev.date;
}

// 날짜 상세보기용: 그 날짜를 포함하는 모든 항목 (여러날 일정도 포함)
function getDayEntries(dateStr){
  const fromItems = items
    .filter(i => i.scheduledDate === dateStr)
    .map(i => ({ id: i.id, text: i.text, note: i.note, time: i.scheduledTime, done: i.done, src: 'item' }));
  const fromEvents = calendarEvents
    .filter(e => e.date <= dateStr && (e.endDate || e.date) >= dateStr)
    .map(e => ({ id: e.id, text: e.text, note: e.note, time: e.time, done: e.done, src: 'event', isMultiDay: isMultiDay(e), date: e.date, endDate: e.endDate }));
  return [...fromItems, ...fromEvents];
}

// 캘린더 칸(그리드) 표시용: 하루짜리 항목만 (여러날 일정은 막대바로 따로 표시)
function getDaySingleEntries(dateStr){
  const fromItems = items
    .filter(i => i.scheduledDate === dateStr)
    .map(i => ({ id: i.id, text: i.text, time: i.scheduledTime, done: i.done, src: 'item' }));
  const fromEvents = calendarEvents
    .filter(e => e.date === dateStr && !isMultiDay(e))
    .map(e => ({ id: e.id, text: e.text, time: e.time, done: e.done, src: 'event' }));
  return [...fromItems, ...fromEvents];
}

function toggleEntryDone(src, id){
  if(src === 'item'){
    const it = items.find(i => String(i.id) === String(id));
    if(it){ it.done = !it.done; save(); }
  } else {
    const ev = calendarEvents.find(e => String(e.id) === String(id));
    if(ev){ ev.done = !ev.done; saveCalEvents(); }
  }
}

function deleteEntry(src, id){
  if(src === 'item'){
    const it = items.find(i => String(i.id) === String(id));
    if(it){ it.scheduledDate = null; it.scheduledTime = null; save(); render(); }
  } else {
    calendarEvents = calendarEvents.filter(e => String(e.id) !== String(id));
    saveCalEvents();
  }
}

function renderCalendar(){
  const year = calDate.getFullYear();
  const month = calDate.getMonth();
  document.getElementById('calMonthLabel').textContent = `${year}년 ${month+1}월`;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = toDateStr(new Date());
  const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;

  const cells = [];
  for(let i = 0; i < totalCells; i++){
    const dayOffset = i - startOffset + 1;
    const cellDate = new Date(year, month, dayOffset);
    cells.push({
      day: cellDate.getDate(),
      other: dayOffset < 1 || dayOffset > daysInMonth,
      dateStr: toDateStr(cellDate)
    });
  }

  const BAR_H = 15, BAR_GAP = 3, DAY_NUM_H = 20;
  const multiDayEvents = calendarEvents.filter(isMultiDay);

  for(let w = 0; w < cells.length; w += 7){
    const week = cells.slice(w, w+7);
    const weekStart = week[0].dateStr, weekEnd = week[6].dateStr;

    const weekEvents = multiDayEvents
      .filter(e => e.date <= weekEnd && e.endDate >= weekStart)
      .sort((a,b) => a.date.localeCompare(b.date));

    const lanes = []; // 각 레인에 배정된 [startCol,endCol] 목록
    const barsInfo = weekEvents.map(e => {
      const startCol = Math.max(0, Math.round((new Date(e.date) - new Date(weekStart)) / 86400000));
      const endCol = Math.min(6, Math.round((new Date(e.endDate) - new Date(weekStart)) / 86400000));
      let lane = lanes.findIndex(occ => !occ.some(([s,en]) => startCol <= en && endCol >= s));
      if(lane === -1){ lane = lanes.length; lanes.push([]); }
      lanes[lane].push([startCol, endCol]);
      return { e, startCol, endCol, lane };
    });
    const lanesCount = lanes.length;
    const spacerH = lanesCount > 0 ? (DAY_NUM_H + lanesCount * (BAR_H + BAR_GAP)) : 0;

    const weekDiv = document.createElement('div');
    weekDiv.className = 'cal-week';

    week.forEach(cell => {
      const div = document.createElement('div');
      div.className = 'cal-day' + (cell.other ? ' other-month' : '');
      if(cell.dateStr === todayStr) div.classList.add('today');
      if(cell.dateStr === selectedDateStr) div.classList.add('selected');

      let eventsHtml = '';
      const dayEntries = getDaySingleEntries(cell.dateStr)
        .sort((a,b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
      if(dayEntries.length > 0){
        const chips = dayEntries.map(entry => {
          const label = (entry.time ? entry.time + ' ' : '') + entry.text;
          const isMovingThis = movingEntry && movingEntry.src === entry.src && String(movingEntry.id) === String(entry.id);
          const cls = 'cal-event-chip' + (entry.src === 'item' ? ' is-todo' : '') + (entry.done ? ' done' : '') + (isMovingThis ? ' moving' : '');
          return `<div class="${cls}" data-moveentry="${entry.src}:${entry.id}">${label}</div>`;
        }).join('');
        eventsHtml = `<div class="cal-day-events">${chips}</div>`;
      }
      const weatherEmoji = weatherByDate[cell.dateStr] !== undefined ? weatherIcon(weatherByDate[cell.dateStr]) : '';
      const weatherHtml = weatherEmoji ? `<img class="cal-day-weather" src="${weatherEmoji}" alt="날씨">` : '';
      const spacerHtml = spacerH > 0 ? `<div style="height:${lanesCount * (BAR_H + BAR_GAP)}px"></div>` : '';
      div.innerHTML = `${weatherHtml}<div class="day-num">${cell.day}</div>${spacerHtml}${eventsHtml}`;

      div.addEventListener('click', () => {
        if(longPressJustFired){ longPressJustFired = false; return; }
        if(movingEntry){
          moveEntryToDate(movingEntry.src, movingEntry.id, cell.dateStr);
          selectedDateStr = cell.dateStr;
          clearMoveMode();
          return;
        }
        selectedDateStr = cell.dateStr;
        renderCalendar();
        renderDayDetail(cell.dateStr);
      });
      weekDiv.appendChild(div);
    });

    barsInfo.forEach(({e, startCol, endCol, lane}) => {
      const bar = document.createElement('div');
      const isMovingThis = movingEntry && movingEntry.src === 'event' && String(movingEntry.id) === String(e.id);
      bar.className = 'cal-bar' + (e.done ? ' done' : '') + (isMovingThis ? ' moving' : '');
      bar.style.left = `calc(${startCol}/7*100% + 2px)`;
      bar.style.width = `calc(${(endCol-startCol+1)}/7*100% - 4px)`;
      bar.style.top = `${DAY_NUM_H + lane*(BAR_H+BAR_GAP)}px`;
      bar.textContent = e.text;
      bar.dataset.moveentry = `event:${e.id}`;
      bar.addEventListener('click', (evt) => {
        evt.stopPropagation();
        if(longPressJustFired){ longPressJustFired = false; return; }
        if(movingEntry) return;
        openEventModal(null, 'event', e.id);
      });
      attachLongPress(bar, () => setMoveMode('event', e.id));
      weekDiv.appendChild(bar);
    });

    grid.appendChild(weekDiv);
  }

  grid.querySelectorAll('.cal-event-chip[data-moveentry]').forEach(chipEl => {
    attachLongPress(chipEl, () => {
      const [src, id] = chipEl.dataset.moveentry.split(':');
      setMoveMode(src, id);
    });
  });

  if(selectedDateStr){
    renderDayDetail(selectedDateStr);
  } else {
    document.getElementById('dayDetail').innerHTML = '';
  }
}

function renderDayDetail(dateStr){
  const panel = document.getElementById('dayDetail');
  const [y,m,d] = dateStr.split('-');
  const dayEntries = getDayEntries(dateStr);
  const addBtnHtml = `<button class="add-event-btn" data-addevent="${dateStr}">+ 이 날짜에 일정 추가</button>`;

  if(dayEntries.length === 0){
    panel.innerHTML = `
      <div class="day-detail-header">${parseInt(m)}월 ${parseInt(d)}일</div>
      ${addBtnHtml}
      <div class="day-detail-empty">이 날짜에 정해진 일정이 없어요</div>
    `;
    return;
  }

  const multiDay = dayEntries.filter(e => e.isMultiDay);
  const timed = dayEntries.filter(e => !e.isMultiDay && e.time).sort((a,b) => a.time.localeCompare(b.time));
  const untimed = dayEntries.filter(e => !e.isMultiDay && !e.time);

  function formatRange(entry){
    const [sy,sm,sd] = entry.date.split('-');
    const [ey,em,ed] = entry.endDate.split('-');
    return `${parseInt(sm)}/${parseInt(sd)} ~ ${parseInt(em)}/${parseInt(ed)}`;
  }

  function entryRow(entry, showTime){
    const isMovingThis = movingEntry && movingEntry.src === entry.src && String(movingEntry.id) === String(entry.id);
    return `<div class="day-detail-item${entry.done ? ' done' : ''}${isMovingThis ? ' moving' : ''}" data-moveentry="${entry.src}:${entry.id}">
      <button class="checkbox ${entry.done ? 'done' : ''}" data-daycheck="${entry.src}:${entry.id}">${entry.done ? '✓' : ''}</button>
      ${showTime ? `<span class="day-detail-time">${entry.time}</span>` : ''}
      <div class="day-detail-textwrap" data-dayopen="${entry.src}:${entry.id}">
        <span class="day-detail-text">${entry.text}</span>
        ${entry.isMultiDay ? `<div class="day-detail-note">📅 ${formatRange(entry)}</div>` : ''}
        ${entry.note ? `<div class="day-detail-note">${entry.note}</div>` : ''}
      </div>
      <button class="del-btn" data-daydel="${entry.src}:${entry.id}">✕</button>
    </div>`;
  }

  let html = `<div class="day-detail-header">${parseInt(m)}월 ${parseInt(d)}일</div>${addBtnHtml}`;

  if(multiDay.length > 0){
    html += `<div class="day-detail-section-label">여러 날 일정</div>`;
    multiDay.forEach(entry => { html += entryRow(entry, false); });
  }
  if(untimed.length > 0){
    html += `<div class="day-detail-section-label">시간 미정</div>`;
    untimed.forEach(entry => { html += entryRow(entry, false); });
  }
  if(timed.length > 0){
    html += `<div class="day-detail-section-label">시간대별</div>`;
    timed.forEach(entry => { html += entryRow(entry, true); });
  }
  panel.innerHTML = html;

  panel.querySelectorAll('.day-detail-textwrap[data-dayopen]').forEach(wrapEl => {
    attachLongPress(wrapEl, () => {
      const [src, id] = wrapEl.dataset.dayopen.split(':');
      setMoveMode(src, id);
    });
  });
}

document.getElementById('dayDetail').addEventListener('click', (e) => {
  if(longPressJustFired){ longPressJustFired = false; return; }
  const checkBtn = e.target.closest('[data-daycheck]');
  const delBtn = e.target.closest('[data-daydel]');
  const addBtn = e.target.closest('[data-addevent]');
  const openBtn = e.target.closest('[data-dayopen]');
  if(checkBtn){
    const [src, id] = checkBtn.dataset.daycheck.split(':');
    toggleEntryDone(src, id);
    renderDayDetail(selectedDateStr);
    renderCalendar();
  }
  if(delBtn){
    const [src, id] = delBtn.dataset.daydel.split(':');
    deleteEntry(src, id);
    renderDayDetail(selectedDateStr);
    renderCalendar();
  }
  if(addBtn){
    openEventModal(addBtn.dataset.addevent);
  }
  if(openBtn){
    const [src, id] = openBtn.dataset.dayopen.split(':');
    openEventModal(null, src, id);
  }
});

document.getElementById('prevMonthBtn').addEventListener('click', () => {
  calDate.setMonth(calDate.getMonth() - 1);
  renderCalendar();
});
document.getElementById('nextMonthBtn').addEventListener('click', () => {
  calDate.setMonth(calDate.getMonth() + 1);
  renderCalendar();
});
document.getElementById('cancelMoveBtn').addEventListener('click', clearMoveMode);

// ---------- 캘린더 좌우 스와이프로 월 이동 ----------
(function(){
  const grid = document.getElementById('calGrid');
  let sx = 0, sy = 0, tracking = false;
  grid.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    sx = t.clientX; sy = t.clientY;
    tracking = true;
  }, { passive: true });
  grid.addEventListener('touchend', (e) => {
    if(!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx;
    const dy = t.clientY - sy;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0){ calDate.setMonth(calDate.getMonth() + 1); }
      else { calDate.setMonth(calDate.getMonth() - 1); }
      renderCalendar();
    }
  });
})();

// ---------- 일정 지정 모달 ----------
let schedulingItemId = null;
const scheduleModal = document.getElementById('scheduleModal');

function openScheduleModal(itemId){
  schedulingItemId = itemId;
  const it = items.find(i => String(i.id) === String(itemId));
  document.getElementById('schedDateInput').value = it && it.scheduledDate ? it.scheduledDate : toDateStr(new Date());
  document.getElementById('schedTimeInput').value = it && it.scheduledTime ? it.scheduledTime : '';
  scheduleModal.style.display = 'flex';
}
function closeScheduleModal(){
  scheduleModal.style.display = 'none';
  schedulingItemId = null;
}

document.getElementById('schedCancelBtn').addEventListener('click', closeScheduleModal);

document.getElementById('schedSaveBtn').addEventListener('click', () => {
  const it = items.find(i => String(i.id) === String(schedulingItemId));
  const dateVal = document.getElementById('schedDateInput').value;
  const timeVal = document.getElementById('schedTimeInput').value;
  if(it && dateVal){

    if(calendarView.style.display !== 'none') renderCalendar();

document.getElementById('schedNoTimeBtn').addEventListener('click', () => {

});

// ---------- 새 일정(캘린더 전용) 추가/수정 모달 ----------
const eventModal = document.getElementById('eventModal');
let editingEntrySrc = null;
let editingEntryId = null;

function findEntry(src, id){
  if(src === 'item') return items.find(i => String(i.id) === String(id));
  if(src === 'event') return calendarEvents.find(e => String(e.id) === String(id));
  return null;
}

function openEventModal(dateStr, editSrc, editId){
  editingEntrySrc = editSrc || null;
  editingEntryId = editId || null;

  const titleEl = document.getElementById('eventModalTitle');
  if(editingEntrySrc && editingEntryId){
    const entry = findEntry(editingEntrySrc, editingEntryId);
    titleEl.textContent = '일정 수정';
    document.getElementById('eventTextInput').value = entry ? entry.text : '';
    document.getElementById('eventNoteInput').value = entry?.note || '';
    document.getElementById('eventDateInput').value = (editingEntrySrc === 'item' ? entry?.scheduledDate : entry?.date) || selectedDateStr || toDateStr(new Date());
    document.getElementById('eventEndDateInput').value = (editingEntrySrc === 'event' ? entry?.endDate : '') || '';
    document.getElementById('eventTimeInput').value = (editingEntrySrc === 'item' ? entry?.scheduledTime : entry?.time) || '';
  } else {
    titleEl.textContent = '새 일정 추가';
    document.getElementById('eventTextInput').value = '';
    document.getElementById('eventNoteInput').value = '';
    document.getElementById('eventDateInput').value = dateStr || selectedDateStr || toDateStr(new Date());
    document.getElementById('eventEndDateInput').value = '';
    document.getElementById('eventTimeInput').value = '';
  }
  eventModal.style.display = 'flex';
  setTimeout(() => document.getElementById('eventTextInput').focus(), 50);
}
function closeEventModal(){
  eventModal.style.display = 'none';
  editingEntrySrc = null;
  editingEntryId = null;
}

document.getElementById('eventCancelBtn').addEventListener('click', closeEventModal);

function saveNewEvent(withTime){
  const text = document.getElementById('eventTextInput').value.trim();
  const note = document.getElementById('eventNoteInput').value.trim();
  const dateVal = document.getElementById('eventDateInput').value;
  let endDateVal = document.getElementById('eventEndDateInput').value || null;
  const timeVal = withTime ? document.getElementById('eventTimeInput').value : '';
  if(!text || !dateVal) return;
  if(endDateVal && endDateVal < dateVal) endDateVal = dateVal; // 마감일이 시작일보다 빠르면 보정
  if(endDateVal === dateVal) endDateVal = null; // 같은 날이면 단일 일정으로 취급

  if(editingEntrySrc && editingEntryId){
    const entry = findEntry(editingEntrySrc, editingEntryId);
    if(entry){
      entry.text = text;
      entry.note = note || null;
      if(editingEntrySrc === 'item'){
        entry.scheduledDate = dateVal;
        entry.scheduledTime = timeVal || null;
        save();
      } else {
        entry.date = dateVal;
        entry.endDate = endDateVal;
        entry.time = timeVal || null;
        saveCalEvents();
      }
    }
  } else {
    calendarEvents.push({ id: Date.now(), text, note: note || null, date: dateVal, endDate: endDateVal, time: timeVal || null, done: false });
    saveCalEvents();
  }
  selectedDateStr = dateVal;
  renderCalendar();
  closeEventModal();
}

document.getElementById('eventSaveBtn').addEventListener('click', () => saveNewEvent(true));
document.getElementById('eventNoTimeBtn').addEventListener('click', () => saveNewEvent(false));

document.getElementById('toggleDone').addEventListener('click', (e) => {
  showDone = !showDone;
  e.target.textContent = showDone ? '진행중만 보기' : '완료 항목 보기';
  render();
});

// ---------- 음성 인식 ----------
const micBtn = document.getElementById('micBtn');
const statusText = document.getElementById('statusText');
const liveText = document.getElementById('liveText');

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isRecording = false;

if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.lang = 'ko-KR';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {
    isRecording = true;
    micBtn.classList.add('recording');
    statusText.textContent = '듣고 있어요...';
    liveText.textContent = '';
  };

  recognition.onresult = (event) => {
    let interim = '';
    let final = '';
    for(let i = event.resultIndex; i < event.results.length; i++){
      const transcript = event.results[i][0].transcript;
      if(event.results[i].isFinal) final += transcript;
      else interim += transcript;
    }
    liveText.textContent = final + interim;
    if(final.trim()){
      items.push({ id: Date.now(), text: final.trim(), done: false, createdAt: Date.now() });
      save();
      render();
    }
  };

  recognition.onerror = (event) => {
    statusText.textContent = event.error === 'not-allowed'
      ? '마이크 권한을 허용해주세요'
      : '다시 시도해주세요';
  };

  recognition.onend = () => {
    isRecording = false;
    micBtn.classList.remove('recording');
    statusText.textContent = '눌러서 말해보세요';
    setTimeout(() => { liveText.textContent = ''; }, 1200);
  };

  micBtn.addEventListener('click', () => {
    if(isRecording){ recognition.stop(); }
    else{ recognition.start(); }
  });
} else {
  statusText.textContent = '이 브라우저는 음성 인식을 지원하지 않아요 (크롬 권장)';
  micBtn.disabled = true;
  micBtn.style.opacity = 0.5;
}

// ---------- 사진으로 아이디어 남기기 ----------
const cameraBtn = document.getElementById('cameraBtn');
const cameraInput = document.getElementById('cameraInput');

cameraBtn.addEventListener('click', () => {
  cameraInput.click();
});

cameraInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const MAX_SIZE = 1000;
      let w = img.width, h = img.height;
      if(w > h && w > MAX_SIZE){ h = Math.round(h * MAX_SIZE / w); w = MAX_SIZE; }
      else if(h >= w && h > MAX_SIZE){ w = Math.round(w * MAX_SIZE / h); h = MAX_SIZE; }

      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.75);

      const caption = prompt('사진에 대한 메모를 남겨주세요 (안 남기셔도 돼요)', '') || '📷 사진 메모';
      items.push({
        id: Date.now(),
        text: caption.trim() || '📷 사진 메모',
        done: false,
        createdAt: Date.now(),
        image: dataUrl
      });
      save();
      render();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  cameraInput.value = '';
});

render();
