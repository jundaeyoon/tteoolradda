<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>떠올랐다!</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --cream: #F3EEE1;
    --dot: #E4DCC8;
    --olive: #6B7250;
    --olive-dark: #4E5439;
    --salmon: #E8927C;
    --salmon-dark: #D9765D;
    --brown: #3D2E24;
    --paper: #FBF8F0;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ height: 100%; }
  body{
    margin:0;
    font-family: 'Pretendard', -apple-system, sans-serif;
    background-color: var(--cream);
    background-image: radial-gradient(var(--dot) 1.4px, transparent 1.4px);
    background-size: 22px 22px;
    color: var(--brown);
    min-height: 100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width: 460px;
    padding: 28px 20px 60px;
    min-height:100vh;
  }
  header{
    text-align:center;
    margin-bottom: 18px;
  }
  header h1{
    font-size: 30px;
    font-weight: 800;
    margin: 0;
    color: var(--olive-dark);
    letter-spacing: -0.5px;
  }
  header p{
    margin: 6px 0 0;
    font-size: 14px;
    color: var(--brown);
    opacity: 0.65;
  }

  /* ---- 마이크 존 ---- */
  .mic-zone{
    position: relative;
    display:flex;
    flex-direction: column;
    align-items:center;
    margin: 22px auto 30px;
  }
  .bubble-wrap{
    position: relative;
    width: 220px;
    height: 190px;
  }
  .bubble-wrap svg{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    filter: drop-shadow(2px 3px 0 rgba(61,46,36,0.15));
  }
  .mic-btn{
    position:absolute;
    left:50%; top:44%;
    transform: translate(-50%,-50%);
    width: 92px; height: 92px;
    border-radius: 50%;
    border: none;
    background: var(--salmon);
    color: var(--paper);
    font-size: 34px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: transform .15s ease, background .2s ease;
    box-shadow: 0 4px 0 var(--salmon-dark);
  }
  .mic-btn:active{
    transform: translate(-50%,-50%) translateY(3px);
    box-shadow: 0 1px 0 var(--salmon-dark);
  }
  .mic-btn.recording{
    background: var(--olive);
    box-shadow: 0 4px 0 var(--olive-dark);
    animation: pulse 1.1s infinite ease-in-out;
  }
  @keyframes pulse{
    0%,100%{ box-shadow: 0 4px 0 var(--olive-dark), 0 0 0 0 rgba(107,114,80,0.5); }
    50%{ box-shadow: 0 4px 0 var(--olive-dark), 0 0 0 14px rgba(107,114,80,0); }
  }
  .status-text{
    min-height: 22px;
    font-size: 14px;
    font-weight: 600;
    color: var(--olive-dark);
    margin-top: 4px;
  }
  .live-text{
    min-height: 24px;
    max-width: 320px;
    text-align:center;
    font-size: 15px;
    color: var(--brown);
    opacity: 0.8;
    font-style: italic;
  }

  /* ---- 리스트 ---- */
  .list-section{ margin-top: 10px; }
  .list-header{
    display:flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding: 0 4px;
  }
  .list-header .count{
    font-size: 14px;
    font-weight: 700;
    color: var(--brown);
  }
  .list-header .count b{ color: var(--salmon-dark); }
  .toggle-btn{
    background: none;
    border: none;
    font-size: 13px;
    color: var(--olive-dark);
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }

  #itemList{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    flex-direction: column;
    gap: 12px;
  }
  .item{
    position: relative;
    background: var(--paper);
    border: 2px solid var(--brown);
    border-radius: 14px 16px 15px 14px / 16px 14px 16px 14px;
    padding: 14px 16px;
    display:flex;
    align-items:flex-start;
    gap: 12px;
    transform: rotate(var(--r, 0deg));
    animation: pop .25s ease;
  }
  .item:nth-child(3n+1){ --r: -0.6deg; }
  .item:nth-child(3n+2){ --r: 0.5deg; }
  .item:nth-child(3n){ --r: -0.3deg; }
  @keyframes pop{
    from{ opacity:0; transform: translateY(6px) rotate(var(--r,0deg)); }
    to{ opacity:1; transform: translateY(0) rotate(var(--r,0deg)); }
  }
  .checkbox{
    flex: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2.5px solid var(--olive);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    margin-top: 1px;
    background: transparent;
    color: var(--paper);
    font-size: 14px;
    font-weight: 900;
  }
  .checkbox.done{
    background: var(--olive);
  }
  .item-body{ flex: 1; min-width: 0; }
  .item-text{
    font-size: 15.5px;
    font-weight: 600;
    line-height: 1.4;
    word-break: break-word;
  }
  .item.done .item-text{
    text-decoration: line-through;
    opacity: 0.45;
  }
  .item-time{
    font-size: 11.5px;
    color: var(--brown);
    opacity: 0.5;
    margin-top: 3px;
  }
  .del-btn{
    flex:none;
    background:none;
    border:none;
    font-size: 16px;
    color: var(--brown);
    opacity: 0.35;
    cursor:pointer;
    padding: 2px 4px;
  }
  .empty{
    text-align:center;
    padding: 30px 10px;
    color: var(--brown);
    opacity: 0.5;
    font-size: 14px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>떠올랐다! 💡</h1>
    <p>말하면 바로 기록돼요. 처리했으면 톡 체크!</p>
  </header>

  <div class="mic-zone">
    <div class="bubble-wrap">
      <svg viewBox="0 0 220 190"></svg>
      <button id="micBtn" class="mic-btn">🎤</button>
    </div>
    <div class="status-text" id="statusText">눌러서 말해보세요</div>
    <div class="live-text" id="liveText"></div>
  </div>

  <div class="list-section">
    <div class="list-header">
      <span class="count">할 일 <b id="pendingCount">0</b>개 남음</span>
      <button class="toggle-btn" id="toggleDone">완료 항목 보기</button>
    </div>
    <ul id="itemList"></ul>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.min.js"></script>
<script>
// ---------- 말풍선 손그림 그리기 (rough.js) ----------
window.addEventListener('load', () => {
  const svg = document.querySelector('.bubble-wrap svg');
  const rc = rough.svg(svg);
  const bubble = rc.path(
    'M20,90 C15,45 55,15 110,15 C165,15 205,45 200,90 C197,120 165,145 110,145 C95,145 85,143 78,140 L55,168 L62,138 C35,128 23,112 20,90 Z',
    { stroke: '#3D2E24', strokeWidth: 3, fill: '#FBF8F0', fillStyle: 'solid', roughness: 1.6 }
  );
  svg.appendChild(bubble);
});

// ---------- 데이터 (localStorage) ----------
const STORAGE_KEY = 'tteoolradda-items';
let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let showDone = false;

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }

function timeAgo(ts){
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  if(sameDay) return `오늘 ${hh}:${mm}`;
  return `${d.getMonth()+1}/${d.getDate()} ${hh}:${mm}`;
}

function render(){
  const list = document.getElementById('itemList');
  const pending = items.filter(i => !i.done);
  document.getElementById('pendingCount').textContent = pending.length;

  const visible = showDone ? items : pending;
  list.innerHTML = '';

  if(visible.length === 0){
    list.innerHTML = `<div class="empty">${showDone ? '아직 완료한 게 없어요' : '아직 아이디어가 없어요.<br>마이크 눌러서 첫 생각을 남겨보세요!'}</div>`;
    return;
  }

  visible.slice().reverse().forEach(item => {
    const li = document.createElement('li');
    li.className = 'item' + (item.done ? ' done' : '');
    li.innerHTML = `
      <button class="checkbox ${item.done ? 'done' : ''}" data-id="${item.id}">${item.done ? '✓' : ''}</button>
      <div class="item-body">
        <div class="item-text">${item.text}</div>
        <div class="item-time">${timeAgo(item.createdAt)}</div>
      </div>
      <button class="del-btn" data-del="${item.id}">✕</button>
    `;
    list.appendChild(li);
  });
}

document.getElementById('itemList').addEventListener('click', (e) => {
  const checkBtn = e.target.closest('.checkbox');
  const delBtn = e.target.closest('.del-btn');
  if(checkBtn){
    const id = checkBtn.dataset.id;
    const it = items.find(i => String(i.id) === id);
    if(it){ it.done = !it.done; save(); render(); }
  }
  if(delBtn){
    const id = delBtn.dataset.del;
    items = items.filter(i => String(i.id) !== id);
    save(); render();
  }
});

document.getElementById('toggleDone').addEventListener('click', (e) => {
  showDone = !showDone;
  e.target.textContent = showDone ? '진행중만 보기' : '완료 항목 보기';
  render();
});

// ---------- 음성 인식 ----------
const micBtn = document.getElementById('micBtn');
const statusText = document.getElementById('statusText');
const liveText = document.getElementById('liveText');

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isRecording = false;

if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.lang = 'ko-KR';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {
    isRecording = true;
    micBtn.classList.add('recording');
    micBtn.textContent = '●';
    statusText.textContent = '듣고 있어요...';
    liveText.textContent = '';
  };

  recognition.onresult = (event) => {
    let interim = '';
    let final = '';
    for(let i = event.resultIndex; i < event.results.length; i++){
      const transcript = event.results[i][0].transcript;
      if(event.results[i].isFinal) final += transcript;
      else interim += transcript;
    }
    liveText.textContent = final + interim;
    if(final.trim()){
      items.push({ id: Date.now(), text: final.trim(), done: false, createdAt: Date.now() });
      save();
      render();
    }
  };

  recognition.onerror = (event) => {
    statusText.textContent = event.error === 'not-allowed'
      ? '마이크 권한을 허용해주세요'
      : '다시 시도해주세요';
  };

  recognition.onend = () => {
    isRecording = false;
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤';
    statusText.textContent = '눌러서 말해보세요';
    setTimeout(() => { liveText.textContent = ''; }, 1200);
  };

  micBtn.addEventListener('click', () => {
    if(isRecording){ recognition.stop(); }
    else{ recognition.start(); }
  });
} else {
  statusText.textContent = '이 브라우저는 음성 인식을 지원하지 않아요 (크롬 권장)';
  micBtn.disabled = true;
  micBtn.style.opacity = 0.5;
}

render();
</script>
</body>
</html>
